[env:esp12e]
platform  = espressif8266
board     = esp12e
framework = arduino

monitor_speed  = 115200
monitor_filters = esp8266_exception_decoder, time
upload_speed   = 921600

upload_port = COM16
monitor_port = COM16

board_build.filesystem = littlefs

lib_deps =
    ; --- дисплей TM1637 (прямая ссылка, т.к. нет в реестре) ---
    https://github.com/jasonacox/TM1637TinyDisplay.git#v1.12.2

    ; --- JSON ---
    bblanchon/ArduinoJson @ ^7.4.2

    ; --- асинхронный веб-сервер (новые имена из ESP32Async) ---
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/ESPAsyncTCP      @ ^2.0.0

    ; --- восход/закат (прямая ссылка, т.к. нет в реестре) ---
    https://github.com/jpb10/SolarCalculator.git

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -D DEBUG_ESP_PORT=Serial
    -Wno-deprecated-declarations